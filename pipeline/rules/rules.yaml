# Drempels voor de WIND- en WAVE-score en het label (PLAN.md 2.3 tot 2.6).
#
# Elke drempel heeft een bron en een bewijsniveau:
#   sterk        een federatie, reddingsdienst of overheid zegt het, of het is gemeten
#   praktijk     scholen, verhuurders of één vereniging; geen officiële norm
#   eigen keuze  geen bron geeft dit getal; gekozen binnen wat de bronnen zeggen, te ijken in M7
#
# Claude Code verandert hier niets zonder dat de eigenaar het vraagt (PLAN.md 2.3).

wind:
  kite:      {s2: 8, s3: 12, s4: 22, s5: 34}      # knopen, ondergrens per score
  windsurf:  {s3: 7, s4: 17, s5: 34}               # geen score 2
  vlagen:    {min4: 30, s5: 38, nota_factor: 1.2, nota_aan: false}   # nota pas aan na M6
  voorzichtig: {s5: 28, vlagen_s5: 30, aan: false} # variant, staat uit
  richting:  {aanlandig: 22.5, schuin_aan: 67.5, zij: 112.5, schuin_af: 157.5}
  # Aflandige wind maakt WIND pas 5 vanaf de kitegrens (kite.s3). Daaronder blijft het cijfer van de
  # sterkte (2) met een uitroepteken: te licht om te kiten, wel goed voor golfsurf (eigenaar, 7 okt 2026).
  aflandig:  {score: 5, vanaf_kn: 12, klassen: [schuin_af, af]}
  windsurf_regels:
    - {van: 7, tot: 11, tekst: "windsurf: beginners kunnen oefenen, zonder planeren"}
    - {van: 12, tot: 16, tekst: "windsurf: planeren begint"}
    - {van: 17, tot: 21, tekst: "windsurf: te veel voor beginners (kitebeginners kunnen nog)"}

wave:
  hb:        {s2: 0.3, s3: 0.5, s4: 1.0, s5: 3.0}  # meter brekend
  s5_alternatief: {waarde: 4.0, aan: false}
  beginnersles_tot: 1.5
  k: 1.0
  bereik: {laag: 0.5, hoog: 2.0}                  # Hb als bereik: factor 0,5 tot 2 door de bodem (PLAN.md 2.2)
  periode:   {max2_onder_s: 6, nota_vanaf_s: 15}
  ipma_zeegang: {score: 5, vanaf: yellow}
  restdeel_als_windgolf: true    # wat de deelgolven tekortkomen op de totale hoogte telt als windgolf (OPEN.md punt 10)

surf_wind:   {beginner_max_kn: 11, gevorderd_max_kn: 19}
stil:        {sup_goed_tot_kn: 10, sup_verbod_boven_kn: 16, sup_les_golf_max_m: 1.0}

bronnen:
  wind.kite.s2:   {bron: "https://www.thekitesurfcentre.com/pages/terms", bewijs: praktijk}
  wind.kite.s3:   {bron: "https://kiteworldwide.com/blog/2024/05/how-much-wind-do-i-need-for-kitesurfing/", bewijs: praktijk}
  wind.kite.s4:   {bron: "https://kiteworldwide.com/blog/2024/05/how-much-wind-do-i-need-for-kitesurfing/", bewijs: "eigen keuze"}
  wind.kite.s5:   {bron: "https://weather.metoffice.gov.uk/guides/coast-and-sea/beaufort-scale", bewijs: "sterk (getal), eigen keuze (betekenis)"}
  wind.vlagen.min4: {bron: "https://www.thekitesurfcentre.com/pages/terms", bewijs: praktijk}
  wind.vlagen.s5: {bron: "https://www.ipma.pt/pt/enciclopedia/otempo/sam/index.html?page=criterios.xml", bewijs: "sterk (getal), eigen keuze (betekenis)"}
  wind.vlagen.nota_factor: {bron: "PLAN.md 2.4, stap 3", bewijs: "eigen keuze"}
  wind.richting:  {bron: "PLAN.md 2.4, stap 2", bewijs: "eigen keuze (sectorgrenzen van 45 graden)"}
  wind.aflandig:  {bron: "https://d8.ikointl.com/system/files/ecourses/files/selfrescue_packdown-v2.0_0.pdf", bewijs: sterk}
  wind.windsurf:  {bron: "https://www.hisc.co.uk/media/17560/hisc-rya-training-sops-2024.pdf", bewijs: praktijk}
  wave.hb.s2:     {bron: "https://isasurf.org/wp-content/uploads/2021/04/ISAOBLIGATIONSOFaregisteredsurfschool010308.pdf", bewijs: praktijk}
  wave.hb.s3:     {bron: "https://www.academyofsurfing.com/surfing-instructor-standards-beginner-level", bewijs: praktijk}
  wave.hb.s4:     {bron: "https://www.academyofsurfing.com/surfing-instructor-standards-advanced-level", bewijs: sterk}
  wave.hb.s5:     {bron: "https://www.academyofsurfing.com/surfing-instructor-standards-advanced-level", bewijs: "sterk als lesgrens, eigen keuze als gevaarlijk"}
  wave.beginnersles_tot: {bron: "https://www.surfingengland.org/wp-content/uploads/2017/03/Surfing-England-English-Surf-School-Scheme.pdf", bewijs: sterk}
  wave.periode.max2_onder_s: {bron: "http://www.stormsurf.com/page2/tutorials/wavebasics.shtml", bewijs: "eigen keuze"}
  wave.periode.nota_vanaf_s: {bron: "https://www.bom.gov.au/weather-and-climate/specialised-forecasts-and-observations/coasts-and-oceans/marine-weather-safety/marine-weather-hazards-and-warnings", bewijs: "eigen keuze"}
  wave.ipma_zeegang: {bron: "https://www.surfingportugal.com/wp-content/uploads/2023/01/Regulamento-Escolas-de-Surf-.pdf", bewijs: sterk}
  wave.k:         {bron: "PLAN.md 2.5", bewijs: "eigen keuze, te ijken in M7"}
  wave.restdeel_als_windgolf: {bron: "OPEN.md punt 10; voorgesteld en aangenomen op 6 oktober 2026", bewijs: "eigen keuze"}
  surf_wind:      {bron: "https://www.academyofsurfing.com/news/understanding-wind-direction-for-stand-up-paddleboarding", bewijs: praktijk}
  stil.sup_goed_tot_kn: {bron: "https://americancanoe.org/wp-content/uploads/2025/02/L2-CK-Assessors-Guide-and-Field-Grids.pdf", bewijs: sterk}
  stil.sup_verbod_boven_kn: {bron: "https://www.amn.pt/DGAM/Capitanias/Cascais/Lists/Documentos_AMN/EDITAL%20185-2016%20da%20Capitania%20do%20Porto%20de%20CASCAIS%20-%20%20vers%C3%A3o%20consolidada.pdf", bewijs: sterk}
  stil.sup_les_golf_max_m: {bron: "https://www.surfingportugal.com/wp-content/uploads/2023/01/Regulamento-Escolas-de-Surf-.pdf", bewijs: sterk}
