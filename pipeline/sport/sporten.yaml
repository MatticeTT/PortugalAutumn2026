# Sportscore 1 tot 5: de grenzen per sport.
# Overgenomen uit het document van de eigenaar "Sportscore 1 tot 5: rekenregels per sport"
# (claude.ai-document R7aGcNGQe984H4BBYD8X94). Niets aanpassen zonder akkoord van de eigenaar.
# De 41 testgevallen van dat document staan in tests/fixtures/sport/cases.csv.

schaal: [niets, te licht, ideaal, sterk, te moeilijk]

groepen:
  A: Surfweer
  B: Windweer
  C: Wind-golven
  D: Stille waters

redenen:  # volgorde telt: de eerste die geldt, wordt getoond
  1: geen water bij laag water
  2: geen strand bij hoog water
  3: ongunstige windrichting
  4: vlagerige wind
  5: water te ruw
  6: te veel wind
  7: golven rommelig door wind
  8: korte periode
  9: verkeerd getij

sporten:
  # Groep A. golf: g1..g4 (GOLF in m). wind1/wind2: zee, opzij, land (W in kn).
  # straf: omlaag (bij a > 112,5 toch omhoog) of omhoog (altijd).
  short:    {naam: Shortboard,    groep: A, golf: [0.5, 1.0, 2.0, 3.5], periode: true,  wind1: [10, 15, 20], wind2: [20, 25, 30], straf: omlaag}
  mid:      {naam: Mid-length,    groep: A, golf: [0.3, 0.6, 1.6, 2.5], periode: true,  wind1: [10, 15, 20], wind2: [20, 25, 30], straf: omlaag}
  long:     {naam: Longboard,     groep: A, golf: [0.3, 0.5, 1.3, 2.0], periode: true,  wind1: [10, 15, 20], wind2: [20, 25, 30], straf: omlaag}
  leren:    {naam: Surfen leren,  groep: A, golf: [0.2, 0.4, 1.0, 1.5], periode: false, wind1: [15, 15, 12], wind2: [22, 22, 20], straf: omhoog}
  body:     {naam: Bodyboard,     groep: A, golf: [0.3, 0.5, 1.5, 2.5], periode: false, wind1: [10, 15, 20], wind2: [20, 25, 30], straf: omlaag}
  supsurf:  {naam: SUP-surfen,    groep: A, golf: [0.2, 0.3, 1.2, 2.0], periode: true,  wind1: [12, 12, 10], wind2: [15, 15, 15], straf: omhoog}
  surffoil: {naam: Surffoil,      groep: A, golf: [0.2, 0.3, 1.0, 1.8], periode: true,  wind1: [10, 15, 20], wind2: [20, 25, 30], straf: omlaag}
  # Groep B. wind: w1..w4 (kn). ruw: r1, r2 (RUW in m; leeg = telt niet). richting: kite, zeil of land.
  kite:     {naam: Kitesurf,      groep: B, wind: [8, 15, 25, 30], ruw: [1.0, 2.5], richting: kite}
  windsurf: {naam: Windsurf,      groep: B, wind: [5, 7, 15, 35],  ruw: [0.5, 2.5], richting: kite}
  wing:     {naam: Wingfoil,      groep: B, wind: [8, 14, 25, 30], ruw: [0.7, 1.5], richting: kite}
  zeil:     {naam: Zeilen,        groep: B, wind: [4, 7, 17, 22],  ruw: [0.5, 1.2], richting: zeil}
  landkite: {naam: Kiten op land, groep: B, wind: [6, 8, 20, 28],  ruw: null,       richting: land}
  # Groep C. wind: w1..w4 (kn). zeekant: ook RICHTING 1 bij a onder 22,5 (wave-windsurf).
  wavekite: {naam: Wave-kitesurf, groep: C, wind: [8, 15, 25, 30], zeekant: false}
  wavewind: {naam: Wave-windsurf, groep: C, wind: [8, 18, 25, 35], zeekant: true}
  # Groep D. ruw: r1, r2 (m). wind: w1, w2 (kn). land: w1, w2 bij wind van land (kn).
  sup:      {naam: SUP,              groep: D, ruw: [0.3, 0.8], wind: [10, 15], land: [8, 12]}
  kajak:    {naam: Kajak,            groep: D, ruw: [0.5, 1.2], wind: [10, 20], land: [8, 15]}
  zwem:     {naam: Zwemmen,          groep: D, ruw: [0.6, 1.2], wind: [12, 22], land: [12, 22]}
  snorkel:  {naam: Snorkelen,        groep: D, ruw: [0.3, 0.8], wind: [10, 15], land: [15, 22]}
  duik:     {naam: Duiken,           groep: D, ruw: [0.5, 1.0], wind: [11, 17], land: [17, 25]}
  wake:     {naam: Wakeboard (boot), groep: D, ruw: [0.3, 0.5], wind: [8, 13],  land: [8, 13]}
  efoil:    {naam: E-foil,           groep: D, ruw: [0.3, 0.9], wind: [10, 15], land: [10, 15]}
