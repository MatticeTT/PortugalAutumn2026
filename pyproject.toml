[project]
name = "surfkaart-pipeline"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
copernicus = ["copernicusmarine>=2.5"]
geo = ["shapely>=2", "pyproj>=3.6", "pyshp>=2.3", "numpy>=1.26"]
dev = ["pytest>=8", "ruff==0.15.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
