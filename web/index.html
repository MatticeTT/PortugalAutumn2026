<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Wind en golven</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="kaart"></div>

  <div class="lagen" role="group" aria-label="Lagen">
    <button id="knop-wind" class="laag aan" aria-pressed="true"><span class="teken wind"></span>Wind</button>
    <button id="knop-deining" class="laag aan" aria-pressed="true" title="Deining: golven van verre stormen, de golven waarop je surft"><span class="teken golf"></span>Deining</button>
    <button id="knop-windzee" class="laag" aria-pressed="false" title="Windzee: korte golven van de wind ter plaatse"><span class="teken golf"></span>Windzee</button>
    <button id="knop-afwisselen" class="laag" aria-pressed="false" title="Wind en golven om beurt tonen"><span class="teken wissel">&#8644;</span>Afwisselen</button>
  </div>

  <div class="tijdlijn">
    <button id="afspelen" class="afspelen" aria-label="Afspelen">
      <svg viewBox="0 0 24 24" class="speel"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" class="pauze"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <div class="schuif">
      <div id="tijd" class="tijd">…</div>
      <input id="schuif" type="range" min="0" max="0" step="1" value="0" aria-label="Tijdstip" />
      <div id="dagen" class="dagen"></div>
    </div>
  </div>

  <div id="bron" class="bron"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
