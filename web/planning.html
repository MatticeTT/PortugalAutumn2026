<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="color-scheme" content="light dark" />
  <title>Planning</title>
  <script>try { const t = localStorage.getItem('thema'); if (t === 'licht' || t === 'donker') document.documentElement.dataset.theme = t === 'licht' ? 'light' : 'dark' } catch {}</script>
</head>
<body>
  <header class="balk">
    <div class="balk-boven">
      <h1>Planning <span>4 weken vanaf vandaag</span></h1>
      <nav class="tabs"><a href="./">Kaart</a><a href="planning" aria-current="page">Planning</a></nav>
      <button id="thema" class="themaknop" type="button" aria-label="Dag of nacht"></button>
    </div>
  </header>
  <main class="planning">
    <section class="instellingen" aria-label="Jouw planning">
      <div id="planvan" class="planvan"></div>
      <div id="voorrang" class="voorrang"></div>
      <p class="uitleg">Per dag één plan: de eerste sport uit dit lijstje die minstens 3 uur na elkaar een score van 60 of meer haalt (cijfer 3 of 4). Kies je categorie voor golf- en windsporten. Gerekend met 75 kg.</p>
    </section>
    <div id="dagen"><p class="klein">Laden…</p></div>
  </main>
  <script type="module" src="/src/planning.ts"></script>
</body>
</html>
