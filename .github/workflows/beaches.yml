# Mijlpaal 1: stranden. Haalt de ruwe data op (OSM, landveelhoeken, EEA),
# zet ze op de tak `raw` (één commit, telkens overschreven) en bouwt de strandentabel.
name: beaches
on:
  workflow_dispatch:
  push:
    paths:
      # Alleen de Portugese bouw; landen.py heeft een eigen workflow (landen.yml).
      - pipeline/beaches/build.py
      - pipeline/beaches/fetch.py
permissions:
  contents: write
concurrency: { group: beaches, cancel-in-progress: false }
jobs:
  beaches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: pip install -e ".[geo]"
      - name: Ruwe data ophalen
        id: fetch
        continue-on-error: true
        run: python -m pipeline.beaches.fetch
      - name: Ruwe data naar de tak raw
        run: |
          mkdir -p /tmp/raw && cd /tmp/raw
          git init -q -b raw
          cp $GITHUB_WORKSPACE/data/raw/*.geojson* $GITHUB_WORKSPACE/data/raw/*.json . 2>/dev/null || true
          rm -f osm_districts_raw.geojsonseq
          ls -la
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Ruwe data voor M1 ($(date -u +%FT%RZ))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" raw
      - name: Strandentabel bouwen
        if: hashFiles('pipeline/beaches/build.py') != ''
        run: python -m pipeline.beaches.build
      - name: Commit resultaat
        if: hashFiles('pipeline/beaches/build.py') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beaches docs/steekproef
          git diff --cached --quiet && exit 0
          git commit -m "M1: strandentabel bijgewerkt vanuit GitHub Actions"
          git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - if: steps.fetch.outcome == 'failure'
        run: echo "Ophalen deels mislukt, zie de stap 'Ruwe data ophalen'" && exit 1
