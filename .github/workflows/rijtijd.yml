# Rijtijd van Ferragudo naar elk strand (OSRM), eenmalig of als de stranden veranderen.
name: rijtijd
on:
  workflow_dispatch:
  push:
    paths:
      - pipeline/site/rijtijd.py
      - .github/workflows/rijtijd.yml
permissions:
  contents: write
jobs:
  rijtijd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pipeline.site.rijtijd
      - name: Vastleggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beaches/rijtijd.json
          git diff --cached --quiet || git commit -q -m "Rijtijden vanaf Ferragudo (OSRM)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${{ github.ref_name }}" || true
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} && break
            sleep $((i * 15))
          done
