# Vergelijking met Open-Meteo (modellen van Windy en Windguru) voor een paar stranden (vergelijk/openmeteo.py).
name: openmeteo
on:
  workflow_dispatch:
  push:
    branches: [ccr-1fe05339-6haah2]
    paths: ["vergelijk/openmeteo.py", ".github/workflows/openmeteo.yml"]
permissions:
  contents: write
jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python vergelijk/openmeteo.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add vergelijk/openmeteo && git commit -q -m "Open-Meteo ter vergelijking" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
