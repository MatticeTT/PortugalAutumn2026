# Strandvlakken van Portugal uit OpenStreetMap (Geofabrik) voor de kaart; resultaat in web/public/basis/stranden.geojson.
name: stranden
on:
  workflow_dispatch:
  push:
    branches: [ccr-1fe05339-6haah2]
    paths: ["pipeline/stranden_osm.py", ".github/workflows/stranden.yml"]
permissions:
  contents: write
jobs:
  stranden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq osmium-tool && pip install -q shapely
      - name: OpenStreetMap Portugal (Geofabrik) filteren op stranden
        run: |
          curl -sSfL -o pt.osm.pbf https://download.geofabrik.de/europe/portugal-latest.osm.pbf
          osmium tags-filter pt.osm.pbf wa/natural=beach -o strand.osm.pbf
          osmium export strand.osm.pbf -f geojson -o strand.geojson --geometry-types=polygon
          python pipeline/stranden_osm.py strand.geojson web/public/basis/stranden.geojson
          ls -la web/public/basis/stranden.geojson
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add web/public/basis/stranden.geojson && git commit -q -m "Strandvlakken uit OpenStreetMap" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
