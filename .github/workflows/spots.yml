name: spots
# Stap 1: spotlijst uit OpenStreetMap. Met de hand starten (en eens per maand).
on:
  workflow_dispatch:
  push:
    branches: [ccr-70a0a2b6-vbws01]
    paths: ["spots/**", "regels/spots.yaml", ".github/workflows/spots.yml"]
  schedule:
    - cron: "17 3 1 * *"
permissions:
  contents: write
jobs:
  spots:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r spots/requirements.txt
      - name: Spots en kustlijn ophalen (Overpass) en doorrekenen
        run: python -m spots.bouw
      - uses: actions/upload-artifact@v4
        with:
          name: spots
          path: |
            data/spots
            !data/spots/ruw/kust
      - name: Resultaat terugzetten in de repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/spots
          git commit -m "Spots uit OpenStreetMap $(date -u +%F)" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
