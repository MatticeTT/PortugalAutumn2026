name: proef
# Proef: voorspelling tegen meting op 14 spots, september 2026 (zie proef/run.py).
# Start handmatig, of bij een push van de proefcode op de werkbranch.
on:
  workflow_dispatch:
  push:
    branches: [ccr-1fe05339-6haah2]
    paths:
      - "proef/*.py"
      - "proef/requirements.txt"
      - ".github/workflows/proef.yml"
permissions:
  contents: write
concurrency:
  group: proef
  cancel-in-progress: false
jobs:
  proef:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: proef/requirements.txt }
      - run: pip install -r proef/requirements.txt
      - run: pytest -q tests/test_proef_fouten.py
      - name: Proef draaien
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python -m proef.run --out proef/results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: proef-results, path: proef/results, if-no-files-found: ignore }
      - name: Resultaten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proef/results
          git diff --cached --quiet && exit 0
          git commit -m "Proef: resultaten september 2026"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
