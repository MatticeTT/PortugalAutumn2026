# Stranden van andere landen (Spanje, Frankrijk, België, Nederland): zelfde meetkunde als Portugal,
# eigen bestanden in data/beaches/landen/ (pipeline/beaches/landen.py). Portugal blijft ongewijzigd.
name: landen
on:
  # Alleen met de hand: een wijziging aan landen.py mag niet alle landen opnieuw bouwen (dat duurt uren).
  workflow_dispatch:
    inputs:
      landen: { description: "landen, bv. es,fr,be,nl", default: "nl" }
permissions:
  contents: write
jobs:
  kies:
    runs-on: ubuntu-latest
    outputs:
      landen: ${{ steps.k.outputs.landen }}
    steps:
      - id: k
        run: |
          l="${{ github.event.inputs.landen || 'nl' }}"
          echo "landen=$(echo "$l" | python3 -c 'import sys,json;print(json.dumps(sys.stdin.read().strip().split(",")))')" >> "$GITHUB_OUTPUT"
  stranden:
    needs: kies
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        land: ${{ fromJSON(needs.kies.outputs.landen) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: pip install -e ".[geo]"
      - name: Ruwe data ophalen
        run: python -m pipeline.beaches.landen ophalen ${{ matrix.land }}
      - name: Strandentabel bouwen
        run: python -m pipeline.beaches.landen bouwen ${{ matrix.land }}
      - name: Commit resultaat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beaches/landen data/gebieden
          git diff --cached --quiet && exit 0
          git commit -m "Stranden ${{ matrix.land }} bijgewerkt vanuit GitHub Actions"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 10))
          done
  getij:
    # Na de stranden: elk strand aan zijn getijstation (pipeline/tides/landen.py).
    needs: stranden
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: git pull -q origin "${GITHUB_REF_NAME}"
      - name: Stranden aan getijstations koppelen
        run: python -m pipeline.tides.landen
      - name: Commit resultaat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tides/stranden_getij_landen.json
          git diff --cached --quiet && exit 0
          git commit -m "Getij voor de stranden van de andere landen"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 10))
          done
