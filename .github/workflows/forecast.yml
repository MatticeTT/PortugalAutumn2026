# Mijlpaal 3: elke 6 uur de voorspelling per strand ophalen. De data komen niet in de
# hoofdtak maar op de tak `data`, als één commit die telkens wordt overschreven
# (docs/architectuur.md).
name: forecast
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"   # één keer per dag (eigenaar), ongeveer 4 uur na de modelrun van 00 UTC
  push:
    paths:
      - pipeline/forecast/**
      - .github/workflows/forecast.yml
permissions:
  contents: write
concurrency: { group: forecast, cancel-in-progress: false }
jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[copernicus]"
      - name: Vorige voorspelling van de tak data
        # De andere landen worden maar twee keer per dag opgehaald: hun bestanden van de vorige run
        # meenemen, anders verdwijnen ze bij de runs ertussen (de tak data wordt telkens overschreven).
        continue-on-error: true
        run: |
          mkdir -p data/forecast
          git fetch -q origin data && git archive FETCH_HEAD forecast | tar -x -C data/ && ls data/forecast
      - name: Voorspelling ophalen
        id: fetch
        continue-on-error: true
        run: python -m pipeline.forecast.fetch
      - name: Naar de tak data
        run: |
          mkdir -p /tmp/data && cd /tmp/data
          git init -q -b data
          mkdir -p forecast && cp $GITHUB_WORKSPACE/data/forecast/*.json forecast/
          ls -la forecast
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Voorspelling $(date -u +%FT%RZ)"
          # GitHub geeft soms een tijdelijke fout (500): tot vier keer opnieuw proberen.
          for i in 1 2 3 4; do
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data && break
            [ $i = 4 ] && exit 1; sleep $((i * 15))
          done
      - name: Archief bijwerken (voor de meting per vooruitzicht, M6)
        continue-on-error: true
        run: |
          # Bij de dagelijkse run (rond 04 UTC); een run met de hand telt niet mee.
          h=$(date -u +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$h" != "04" ] && [ "$h" != "16" ]; then exit 0; fi
          if git fetch -q origin archief; then
            git worktree add -q -B archief /tmp/archief FETCH_HEAD
          else
            git worktree add -q --orphan -b archief /tmp/archief
          fi
          python -m pipeline.validate.archive /tmp/archief
          cd /tmp/archief
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Archief $(date -u +%FT%RZ)"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:archief
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Site bouwen
        run: |
          # Bouw met de nieuwste code van deze tak, niet die van het begin van deze (trage) run:
          # anders overschrijft een oudere opmaak een publicatie van site.yml die intussen klaar was.
          git fetch -q origin "${{ github.ref_name }}" && git checkout -q --detach FETCH_HEAD
          python -m pipeline.site.build_data
          cd web && npm ci && npm run build
      - name: Naar de tak site (Vercel publiceert die tak)
        run: |
          cd web/dist
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Site $(date -u +%FT%RZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
      - if: steps.fetch.outcome == 'failure'
        run: echo "Een of meer bronnen faalden, zie 'Voorspelling ophalen'" && exit 1
