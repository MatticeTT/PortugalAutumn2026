name: verken
# Verkenning van de Copernicus-golfproducten (zie pipeline/copernicus_verken.py).
on:
  workflow_dispatch:
  push:
    branches: [ccr-1fe05339-6haah2]
    paths:
      - "pipeline/copernicus_verken.py"
      - ".github/workflows/verken.yml"
permissions:
  contents: write
jobs:
  verken:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: proef/requirements.txt }
      - run: pip install -r proef/requirements.txt
      - name: Verkennen
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python -m pipeline.copernicus_verken
      - name: Resultaat committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/verkenning || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Verkenning Copernicus-golfproducten"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
