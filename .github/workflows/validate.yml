# Mijlpaal 6: nauwkeurigheid meten met historische voorspellingen en metingen.
name: validate
on:
  workflow_dispatch:
  push:
    paths:
      - pipeline/validate/**
      - .github/workflows/validate.yml
permissions:
  contents: write
concurrency: { group: validate, cancel-in-progress: false }
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[copernicus]"
      - name: Proef van de historische bronnen
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: python -m pipeline.validate.probe
      - name: Golfmodellen naast de boeien
        continue-on-error: true
        run: python -m pipeline.validate.waves
      - name: Windmodellen naast de IPMA-stations (uit het archief)
        continue-on-error: true
        run: |
          git fetch -q origin archief && git worktree add -q /tmp/archief FETCH_HEAD
          python -m pipeline.validate.wind /tmp/archief
      - name: Commit resultaat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validate/*.json
          git diff --cached --quiet && exit 0
          git commit -m "M6: resultaat vanuit GitHub Actions"
          git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
