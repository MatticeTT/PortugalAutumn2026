name: bereik
# Test welke bronnen bereikbaar zijn vanaf GitHub.
on:
  workflow_dispatch:
  push:
    branches: [ccr-70a0a2b6-vbws01]
    paths: [".github/workflows/bereik.yml"]
jobs:
  bereik:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="surfkaart (github.com/MatticeTT/PortugalAutumn2026)"
          for u in https://www.ngdc.noaa.gov/mgg/shorelines/data/gshhs/latest/gshhg-shp-2.3.7.zip \
                   https://www.ngdc.noaa.gov/mgg/shorelines/data/gshhs/latest/ ; do
            echo "$(curl -s -o /dev/null -I -L -m 60 -w '%{http_code} %{size_download} %header{content-length}' "$u") $u"
          done
          echo "== Overpass met naam"
          curl -s -m 300 -A "$UA" https://overpass-api.de/api/interpreter --data-urlencode 'data=[out:json][timeout:250];nwr["sport"="surfing"];out count;' | head -c 800; echo
