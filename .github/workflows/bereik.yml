name: bereik
# Test welke bronnen bereikbaar zijn vanaf GitHub.
on:
  workflow_dispatch:
  push:
    branches: [ccr-70a0a2b6-vbws01]
    paths: [".github/workflows/bereik.yml"]
jobs:
  bereik:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== NOAA-pagina, links met gshhg"
          curl -sL -m 60 https://www.ngdc.noaa.gov/mgg/shorelines/ | grep -oiE 'href="[^"]*gshh[^"]*"' | sort -u | head -30
          echo "== osmdata via http"
          curl -s -o /dev/null -I --connect-timeout 20 -w '%{http_code}\n' http://osmdata.openstreetmap.de/ || true
          echo "== Overpass kleine vraag"
          curl -s -m 120 https://overpass-api.de/api/interpreter --data-urlencode 'data=[out:json];nwr["sport"="surfing"];out count;' | head -c 600; echo
