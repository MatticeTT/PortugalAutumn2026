# Gedetailleerde kustlijn uit OpenStreetMap (osmdata.openstreetmap.de, ODbL) voor de kaart; resultaat committen.
name: kustlijn
on:
  workflow_dispatch:
  push:
    branches: [ccr-1fe05339-6haah2]
    paths:
      - "pipeline/kustlijn.py"
      - ".github/workflows/kustlijn.yml"
permissions:
  contents: write
jobs:
  kustlijn:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyshp==2.3.1 shapely==2.0.6
      - name: Land polygons downloaden
        run: curl -sSfL -o land.zip https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip && ls -la land.zip
      - run: python -m pipeline.kustlijn --zip land.zip --uit web/public/basis
      - name: Resultaat committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/basis/land-fijn.geojson
          git diff --cached --quiet && exit 0
          git commit -m "Gedetailleerde kustlijn uit OpenStreetMap (Portugal)"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
