# Testversie van de kaart: dezelfde verwerking als `kaart`, maar de site gaat naar de tak `voorbeeld`
# (niet gepubliceerd door Vercel). Start bij een push van de kaartcode op de werkbranch, of met de hand.
name: voorbeeld
on:
  workflow_dispatch:
  push:
    branches: [ccr-1fe05339-6haah2]
    paths:
      - "pipeline/build.py"
      - "pipeline/golven.py"
      - "pipeline/controle_golven.py"
      - "web/src/**"
      - "web/index.html"
      - ".github/workflows/voorbeeld.yml"
permissions:
  contents: write
concurrency: { group: voorbeeld, cancel-in-progress: true }
jobs:
  voorbeeld:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Wind en golven ophalen en omzetten
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python -m pipeline.build --out web/public/data
          python -m pipeline.controle_golven --data web/public/data
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Site bouwen
        run: |
          cd web && npm ci && npm run build
          du -sh dist dist/data; for n in wind swell windsea; do printf "%s " $n; find dist/data -path "*$n*" -type f -printf "%s\n" | awk '{s+=$1} END {print s/1e6 " MB"}'; done
      - name: Naar de tak voorbeeld
        run: |
          cd web/dist
          git init -q -b voorbeeld
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Voorbeeld $(date -u +%FT%RZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voorbeeld
