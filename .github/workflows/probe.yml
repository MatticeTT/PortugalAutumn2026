# Mijlpaal 0: één echte aanroep per bron, vanuit een omgeving met open netwerk.
# Schrijft de antwoorden naar tests/fixtures/probe/ en commit ze terug.
name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - pipeline/probe/**
      - pipeline/tides/probe.mjs
      - .github/workflows/probe.yml
      - pyproject.toml
permissions:
  contents: write
concurrency: { group: probe, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PROBE_VIA: github-actions
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: pip install -e ".[copernicus]"
      - run: npm ci
      - run: python -m pipeline.probe.probe
      - run: node pipeline/tides/probe.mjs
      - run: cat tests/fixtures/probe/manifest.json
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/probe
          git diff --cached --quiet && exit 0
          git commit -m "M0: proefantwoorden bijgewerkt vanuit GitHub Actions"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
