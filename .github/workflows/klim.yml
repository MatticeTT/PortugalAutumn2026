# Klimplekken ophalen (OpenStreetMap, Camptocamp), één keer per week, en bewaren in data/klim/ (op deze tak).
# Portugal in data/klim/, Spanje, Frankrijk en België in data/klim/<land>/.
name: klim
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"   # maandag 03:41 UTC
  push:
    paths:
      - pipeline/klim/ophalen.py
      - .github/workflows/klim.yml
permissions:
  contents: write
jobs:
  klim:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pipeline.klim.ophalen
      - name: Andere landen (Spanje, Frankrijk, België)
        continue-on-error: true
        run: python -m pipeline.klim.ophalen es fr be
      - name: Vastleggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in bron_osm bron_c2c status; do [ -f data/klim/$f.json ] && git add data/klim/$f.json; done
          for l in es fr be; do for f in bron_osm bron_c2c; do [ -f data/klim/$l/$f.json ] && git add data/klim/$l/$f.json; done; done
          git diff --cached --quiet || git commit -q -m "Klimplekken uit OpenStreetMap $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${{ github.ref_name }}" || true
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} && break
            sleep $((i * 15))
          done
