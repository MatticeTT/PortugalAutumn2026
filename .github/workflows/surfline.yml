# Surfline-voorspelling voor Portugal ophalen om onze app ermee te vergelijken (vergelijk/surfline.py).
name: surfline
on:
  workflow_dispatch:
  push:
    branches: [ccr-1fe05339-6haah2]
    paths:
      - "vergelijk/surfline.py"
      - ".github/workflows/surfline.yml"
permissions:
  contents: write
jobs:
  surfline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python vergelijk/surfline.py
      - name: Resultaat committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add vergelijk/surfline
          git commit -m "Surfline-voorspelling voor vergelijking" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
