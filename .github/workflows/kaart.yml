# Elke 6 uur de nieuwste GFS-run (wind 10 m en golven) omzetten naar PNG's, de site bouwen en
# naar de tak `site` zetten; Vercel publiceert die tak.
name: kaart
on:
  workflow_dispatch:
  schedule:
    - cron: "20 5,11,17,23 * * *"   # ongeveer 5 uur na elke modelrun (00, 06, 12, 18 UTC)
permissions:
  contents: write
concurrency: { group: kaart, cancel-in-progress: false }
jobs:
  kaart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Wind en golven ophalen en omzetten
        run: python -m pipeline.build --out web/public/data --max-hour 120 --step 3
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Site bouwen
        run: cd web && npm ci && npm run build
      - name: Naar de tak site
        run: |
          cd web/dist
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Kaart $(date -u +%FT%RZ)"
          for i in 1 2 3 4; do
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site && break
            [ $i = 4 ] && exit 1; sleep $((i * 15))
          done
