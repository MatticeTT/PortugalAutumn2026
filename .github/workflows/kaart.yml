# Twee keer per dag de nieuwste ECMWF-run (wind 10 m, 15 dagen vooruit) en Copernicus-golven (deining en
# windzee, 10 dagen vooruit) omzetten naar afbeeldingen, de plankscore per spot rekenen, de site bouwen en naar
# de tak `site` zetten; Vercel publiceert die tak.
name: kaart
on:
  workflow_dispatch:
  schedule:
    - cron: "40 8,20 * * *"   # de open data van de runs van 00 en 12 UTC zijn na ongeveer 8 uur compleet
permissions:
  contents: write
concurrency: { group: kaart, cancel-in-progress: false }
jobs:
  kaart:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Wind en golven ophalen en omzetten
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python -m pipeline.build --out web/public/data
          python -m pipeline.controle_golven --data web/public/data
      - name: EOT20 uit de cache
        id: eot20
        uses: actions/cache@v4
        with:
          path: getij/EOT20/ocean_tides
          key: eot20-ocean-v1
      - name: EOT20 downloaden (SEANOE, CC BY 4.0)
        if: steps.eot20.outputs.cache-hit != 'true'
        run: python -m pipeline.eot20 getij
      - name: Score per spot (golven, wind, getij per spot; plankscore per kwartier)
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python -m pipeline.spotinvoer --spots spots/spots.json --getij getij --uit spotinvoer.json.gz
          python -m pipeline.spotscore --invoer spotinvoer.json.gz --uit web/public/data/spots
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Site bouwen
        run: |
          cd web && npm ci && npm run build
          # Vercel (gratis plan) aanvaardt hooguit 100 MB per publicatie.
          size=$(du -sb dist | cut -f1); echo "dist: $((size / 1000000)) MB"
          [ "$size" -lt 99000000 ] || { echo "Te groot voor Vercel"; exit 1; }
      - name: Naar de tak site
        run: |
          cd web/dist
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Kaart $(date -u +%FT%RZ)"
          for i in 1 2 3 4; do
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site && break
            [ $i = 4 ] && exit 1; sleep $((i * 15))
          done
