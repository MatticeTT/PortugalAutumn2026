# De site publiceren met de laatst opgehaalde voorspelling (tak `data`). Alleen met de hand (na een reeks
# wijzigingen): Vercel (gratis plan) laat maar een beperkt aantal publicaties per dag toe. De dagelijkse
# voorspelling (forecast.yml) publiceert de site ook, één keer per dag.
name: site
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: site, cancel-in-progress: true }
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Laatste voorspelling van de tak data
        run: |
          git fetch -q origin data
          git archive FETCH_HEAD forecast | tar -x -C data/
          ls -la data/forecast
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Site bouwen
        run: |
          python -m pipeline.site.build_data
          cd web && npm ci && npm run build
      - name: Naar de tak site (Vercel publiceert die tak)
        run: |
          cd web/dist
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Site $(date -u +%FT%RZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
