name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements.txt" }
      - run: pip install -r pipeline/requirements.txt -r proef/requirements.txt
      - run: pytest -q tests --ignore=tests/test_spots.py
      # apart proces: eccodes en pyproj botsen in één proces
      - run: pip install -r spots/requirements.txt && pytest -q tests/test_spots.py
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run build
